<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Texture Lab">
<title>Texture Lab</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#f7f6f2">

<style>
/* VOICE: a quiet instrument panel — the drawing is the loud part
   IDEA: a specimen sheet from a materials lab, numbered brushes like plates
   PICTURE: the live lit canvas, edge to edge on the left
   COLOUR and TYPE: bone paper, ink black, one black active state; Helvetica + small mono labels like the reference
   LAYOUT: header, canvas | control panel, sticky export footer */
:root{--bg:#efeee9;--paper:#f7f6f2;--ink:#141414;--mute:#8a877f;--line:#d6d3cb;--soft:#e4e2db;--acc:#141414}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
#app{position:fixed;inset:0;display:grid;grid-template-rows:46px 1fr 30px;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--paper)}
header .logo{font-weight:700;font-size:13px;letter-spacing:.02em}
header .sep{width:1px;height:16px;background:var(--line)}
header .crumb{color:var(--mute)} header .crumb b{color:var(--ink);font-weight:600}
header nav{margin-left:auto;display:flex;gap:4px}
.tab{border:0;background:none;padding:7px 10px;border-radius:2px;cursor:pointer}
.tab.on{background:var(--ink);color:#fff}
main{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:0}
#stage{position:relative;overflow:hidden;background:var(--bg);touch-action:none}
#view{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 1px 0 rgba(0,0,0,.04),0 10px 40px -20px rgba(0,0,0,.35)}
#view canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#view .checker{position:absolute;inset:0;background:conic-gradient(#ddd 25%,#f4f4f4 0 50%,#ddd 0 75%,#f4f4f4 0) 0 0/16px 16px;display:none}
#view.transp .checker{display:block}
#ov{pointer-events:none}
.toolbar{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:5}
.toolbar.right{left:auto;right:12px;top:12px;bottom:auto}
.tb{min-width:44px;height:40px;padding:0 12px;border:1px solid var(--line);background:var(--paper);border-radius:2px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tb:disabled{opacity:.35}
.tb svg{width:16px;height:16px}
#busy{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:6px 12px;border-radius:2px;display:none;z-index:6}
#toast{position:absolute;top:12px;right:12px;background:var(--ink);color:#fff;padding:8px 12px;border-radius:2px;opacity:0;transition:opacity .25s;z-index:7;pointer-events:none;max-width:280px}
aside{border-left:1px solid var(--line);background:var(--paper);display:grid;grid-template-rows:1fr auto;min-height:0}
#panel{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:20px}
.pane{display:none}.pane.on{display:block}
.sec{border-bottom:1px solid var(--line);padding:12px 14px}
.sec>h4{margin:0 0 10px;font-weight:400}
.bhead{padding:14px}
.bhead .num{color:var(--mute)}
.bhead h2{margin:4px 0 4px;font-size:22px;letter-spacing:-.01em;font-weight:700;line-height:1.05}
.bhead p{margin:0;color:#57544e;font-size:12px}
.bnav{display:flex;gap:6px;margin-top:10px}
.row{margin:0 0 12px}
.row:last-child{margin-bottom:0}
.lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.lab .v{color:var(--mute)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;touch-action:pan-x}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:22px;background:var(--ink);border-radius:1px;margin-top:-10px}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:14px;height:22px;background:var(--ink);border:0;border-radius:1px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--ink);border-radius:2px;overflow:hidden}
.seg.wrap{grid-auto-flow:row;grid-template-columns:repeat(3,1fr)}
.seg button{border:0;background:var(--paper);padding:0 4px;height:34px;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg.wrap button{border-left:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff}
.sw{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw button{width:30px;height:30px;border-radius:2px;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0}
.sw button.on{outline:2px solid var(--ink);outline-offset:2px}
.sw input[type=color]{width:34px;height:32px;border:1px solid var(--line);border-radius:2px;padding:1px;background:var(--paper)}
.tog{display:flex;align-items:center;gap:8px;cursor:pointer;height:32px}
.tog i{width:18px;height:18px;border:1px solid var(--ink);display:inline-block;position:relative;border-radius:1px}
.tog.on i{background:var(--ink)} .tog.on i:after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:40px;border:1px solid var(--ink);background:var(--paper);border-radius:2px;cursor:pointer}
.btn.dark{background:var(--ink);color:#fff}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.foot{border-top:1px solid var(--line);padding:10px 14px;display:grid;gap:8px;background:var(--paper)}
.hint{color:var(--mute);font-size:11px;line-height:1.45;margin:6px 0 12px}
footer{display:flex;align-items:center;gap:16px;padding:0 14px;border-top:1px solid var(--line);background:var(--paper);color:var(--mute)}
footer .r{margin-left:auto}
canvas.graph{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:2px;touch-action:none;background:#fff}
canvas.mini{width:150px;height:55px;display:block;margin:-4px 0 12px}
#dial{display:block;width:150px;height:150px;margin:0 auto 10px;touch-action:none;cursor:crosshair}
.slist{display:grid;gap:4px;max-height:280px;overflow:auto}
.srow{display:grid;grid-template-columns:28px 1fr 36px;align-items:center;gap:8px;padding:4px 6px;border:1px solid var(--line);border-radius:2px;cursor:pointer;min-height:40px}
.srow.on{border-color:var(--ink);background:#fff}
.srow .th{width:28px;height:28px;border-radius:2px;background:#ccc}
.srow .eye{border:0;background:none;height:36px;cursor:pointer;color:var(--mute)}
.srow.hid{opacity:.45}
select{font:inherit;width:100%;height:36px;border:1px solid var(--ink);border-radius:2px;background:var(--paper);padding:0 8px}
#grid{position:fixed;inset:0;background:rgba(239,238,233,.97);z-index:20;display:none;grid-template-rows:auto 1fr;padding:env(safe-area-inset-top) 0 0}
#grid.on{display:grid}
#grid .gh{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
#grid .gh h3{margin:0;font-size:18px}
#grid .gh button{margin-left:auto}
#tiles{overflow:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;align-content:start;grid-auto-rows:max-content}
.tile{border:1px solid var(--line);background:var(--paper);border-radius:2px;cursor:pointer;padding:0;text-align:left;overflow:hidden;display:flex;flex-direction:column;align-items:stretch}
.tile.on{border-color:var(--ink);outline:1px solid var(--ink)}
.tile .img{height:130px;width:100%;flex:none;background:var(--soft) center/cover no-repeat}
.tile .t{padding:8px 10px 10px}
.tile .t b{display:block;font-size:14px;margin:2px 0 2px}
.tile .t span{color:#57544e;font-size:11px;display:block}
@media (orientation:portrait) and (max-width:1100px){main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 44%}aside{border-left:0;border-top:1px solid var(--line);grid-template-columns:1fr 240px;grid-template-rows:1fr}aside .foot{border-top:0;border-left:1px solid var(--line);align-content:start}}
@media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 46%}aside{border-left:0;border-top:1px solid var(--line)}header .crumb{display:none}}
</style>
</head>
<body>
<div id="app">
<header>
  <span class="logo">(TEXTURE)LAB</span><span class="sep"></span>
  <span class="crumb mono"><span id="hNum">01 / 22</span> &nbsp; <b id="hName">—</b></span>
  <nav class="mono" id="tabs">
    <button class="tab" data-t="grid">All brushes</button>
    <button class="tab on" data-t="brush">Brush</button>
    <button class="tab" data-t="scene">Scene</button>
    <button class="tab" data-t="strokes">Strokes</button>
    <button class="tab" data-t="export">Animate</button>
  </nav>
</header>
<main>
  <div id="stage">
    <div id="view"><div class="checker"></div><canvas id="gl"></canvas><canvas id="ov"></canvas></div>
    <div id="busy" class="mono">Rendering…</div><div id="toast"></div>
    <div class="toolbar mono">
      <button class="tb" id="bUndo" title="Undo (two-finger tap)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 3 2 6l3 3"/><path d="M2 6h7a4 4 0 0 1 0 8H6"/></svg></button>
      <button class="tb" id="bRedo" title="Redo (three-finger tap)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m11 3 3 3-3 3"/><path d="M14 6H7a4 4 0 0 0 0 8h3"/></svg></button>
      <button class="tb" id="bErase">Eraser</button>
      <button class="tb" id="bSym">Sym: off</button>
      <button class="tb" id="bMove">Move</button>
    </div>
    <div class="toolbar right mono">
      <button class="tb" id="bOrbit">Orbit light</button>
      <button class="tb" id="bPlay">▶ Animate</button>
      <button class="tb" id="bRec">Export MP4</button>
      <button class="tb" id="bFit">Fit</button>
    </div>
  </div>
  <aside>
    <div id="panel">
      <div class="pane on" id="p-brush"></div>
      <div class="pane" id="p-scene"></div>
      <div class="pane" id="p-strokes"></div>
      <div class="pane" id="p-export"></div>
    </div>
    <div class="foot mono">
      <button class="btn dark" id="fEnh">Enhance quality</button>
      <div class="btn2"><button class="btn" id="fPng">Download PNG</button><button class="btn" id="fClear">Clear</button></div>
      <div class="tog" id="fTr"><i></i><span>Transparent background</span></div>
    </div>
  </aside>
</main>
<footer class="mono"><span>(TEXTURE)LAB</span><span id="stInfo">—</span><span class="r" id="stTip">Pencil draws · two fingers pan/zoom · two-finger tap undo</span></footer>
</div>
<div id="grid"><div class="gh"><h3>Brushes</h3><button class="tb mono" id="gClose">Close</button></div><div id="tiles"></div></div>
<input type="file" id="fileImg" accept="image/*" hidden><input type="file" id="fileProj" accept=".json,application/json" hidden>
<script>
{
// ================= ENGINE: noise, surface, primitives, path generation =================
const M={BG:0,CERAMIC:1,STONE:2,KMETAL:3,CHROME:4,GOLD:5,STEEL:6,PASTE:7,FOAM:8,SAND:9,INK:10,MOSS:11,GLASS:12,PEARL:13,PLASTIC:14,WOOD:15,LEAF:16,CLAY:17,CYANO:18,BRONZE:19,SILVER:20,GSAND:21,BLOOD:22,PETAL:23};
const MATNAME={chrome:M.CHROME,gold:M.GOLD,steel:M.STEEL,pearl:M.PEARL,plastic:M.PLASTIC,bronze:M.BRONZE,silver:M.SILVER,glass:M.GLASS,ceramic:M.CERAMIC,leaf:M.LEAF,moss:M.MOSS,stone:M.STONE,clay:M.CLAY,wood:M.WOOD,kmetal:M.KMETAL};

// ---- value-noise fbm, tileable 256 ----
const NZN=256, NZ=new Float32Array(NZN*NZN);
(function(){
  let s=1337; const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647;};
  const oct=[8,16,32,64,128], amp=[1,.5,.25,.125,.0625];
  for(let o=0;o<oct.length;o++){
    const C=oct[o], g=new Float32Array(C*C); for(let i=0;i<C*C;i++) g[i]=rnd()*2-1;
    const sc=C/NZN;
    for(let y=0;y<NZN;y++){ const fy=y*sc, iy=Math.floor(fy), ty=fy-iy, sy=ty*ty*(3-2*ty), y0=iy%C, y1=(iy+1)%C;
      for(let x=0;x<NZN;x++){ const fx=x*sc, ix=Math.floor(fx), tx=fx-ix, sx=tx*tx*(3-2*tx), x0=ix%C, x1=(ix+1)%C;
        const a=g[y0*C+x0], b=g[y0*C+x1], c=g[y1*C+x0], d=g[y1*C+x1];
        NZ[y*NZN+x]+=amp[o]*((a+(b-a)*sx)*(1-sy)+(c+(d-c)*sx)*sy);
      }}
  }
  let mx=0; for(let i=0;i<NZ.length;i++) mx=Math.max(mx,Math.abs(NZ[i]));
  for(let i=0;i<NZ.length;i++) NZ[i]/=mx;
})();
function nz(x,y){
  const fx=Math.floor(x), fy=Math.floor(y), tx=x-fx, ty=y-fy;
  const x0=fx&255, y0=fy&255, x1=(x0+1)&255, y1=(y0+1)&255;
  const a=NZ[y0*256+x0], b=NZ[y0*256+x1], c=NZ[y1*256+x0], d=NZ[y1*256+x1];
  return (a+(b-a)*tx)*(1-ty)+(c+(d-c)*tx)*ty;
}
const n1=t=>nz(t,t*0.137+91.7);
function hash2(x,y){ let h=(x*374761393+y*668265263)|0; h=(h^(h>>>13))*1274126177|0; return ((h^(h>>>16))>>>0)/4294967295; }
function mulberry(a){ a=a>>>0; return function(){ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function hex2rgb(h){ h=(h||'#888').replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

// ---- profiles ----
const PF={
  round:q=>Math.sqrt(1-q*q),
  ridge:q=>1-q,
  soft:q=>0.5+0.5*Math.cos(q*Math.PI),
  paste:q=>Math.sqrt(Math.max(0,1-q*q*q*q))*0.72,
  rim:q=>Math.exp(-(((q-0.7)/0.24)**2))*0.9+0.15*(1-q),
  plateau:q=>q<0.55?1:Math.cos((q-0.55)/0.45*Math.PI/2),
  stone:q=>Math.pow(1-q*q,0.5),
  flatten:q=>Math.pow(1-q*q,0.8)*0.8,
};

// ---- Surface ----
class Surface{
  constructor(docW,docH,q){
    this.docW=docW; this.docH=docH; this.w=Math.max(8,Math.round(docW*q/2)*2); this.h=Math.max(8,Math.round(docH*q/2)*2); this.q=this.w/docW;
    const n=this.w*this.h; this.H=new Float32Array(n); this.T=new Uint8Array(n*4); this.X=new Uint8Array(n*4); this.H0=new Float32Array(n);
    this.T0=null; this.X0=null; this.full=true; this.d=null; this.sb=null;
  }
  clear(){ this.H.fill(0); this.T.fill(0); this.X.fill(0); this.full=true; this.d=null; if(this.E) this.clearAnim(); }
  ensureAnim(){ if(this.E) return; const n=this.w*this.h; this.E=new Int32Array(n); this.B=new Float32Array(n*2); this.Hu=new Float32Array(n); this.Tu=new Uint8Array(n*4); this.Xu=new Uint8Array(n*4); this.clearAnim(); }
  clearAnim(){ this.E.fill(0); const B=this.B; for(let i=0;i<B.length;i+=2){ B[i]=0; B[i+1]=-1; } this.Hu.fill(0); this.Tu.fill(0); this.Xu.fill(0); this.eidN=0; this.animFull=true; }
  mark(x0,y0,x1,y1){
    const d=this.d; if(!d) this.d=[x0,y0,x1,y1]; else { if(x0<d[0])d[0]=x0; if(y0<d[1])d[1]=y0; if(x1>d[2])d[2]=x1; if(y1>d[3])d[3]=y1; }
    const s=this.sb; if(s){ if(x0<s[0])s[0]=x0; if(y0<s[1])s[1]=y0; if(x1>s[2])s[2]=x1; if(y1>s[3])s[3]=y1; }
  }
  snapH(){ this.H0.set(this.H); if(this.SU) this.SU.fill(-1e9); }
  snapAll(){ this.H0.set(this.H); if(this.SU) this.SU.fill(-1e9); if(!this.T0){ this.T0=new Uint8Array(this.T.length); this.X0=new Uint8Array(this.X.length);} this.T0.set(this.T); this.X0.set(this.X); this.sb=[1e9,1e9,-1,-1]; }
  restore(){
    const s=this.sb; this.sb=null; if(!s||s[2]<0) return; const W=this.w;
    for(let y=s[1];y<=s[3];y++){ const a=y*W+s[0], b=y*W+s[2]+1;
      this.H.set(this.H0.subarray(a,b),a); this.T.set(this.T0.subarray(a*4,b*4),a*4); this.X.set(this.X0.subarray(a*4,b*4),a*4); }
    this.mark(s[0],s[1],s[2],s[3]);
  }
  hAt(x,y){ const xi=Math.round(x*this.q), yi=Math.round(y*this.q); if(xi<0||yi<0||xi>=this.w||yi>=this.h) return 0; return this.H[yi*this.w+xi]; }
  h0At(x,y){ const xi=Math.round(x*this.q), yi=Math.round(y*this.q); if(xi<0||yi<0||xi>=this.w||yi>=this.h) return 0; return this.H0[yi*this.w+xi]; }
}

// write one pixel. modes: 0 max, 1 smooth-vs-H0, 2 press(deboss), 3 ink, 4 erase
function layerSwap(S,i,o,bt){
  const e=S.E[i];
  bt=Math.max(0,bt);
  if(e!==o.eid){ if(e!==0){ S.Hu[i]=S.H[i]; const j=i*4; S.Tu[j]=S.T[j];S.Tu[j+1]=S.T[j+1];S.Tu[j+2]=S.T[j+2];S.Tu[j+3]=S.T[j+3]; S.Xu[j]=S.X[j];S.Xu[j+1]=S.X[j+1];S.Xu[j+2]=S.X[j+2];S.Xu[j+3]=S.X[j+3]; S.B[i*2+1]=S.B[i*2]; } S.E[i]=o.eid||1; S.B[i*2]=bt+(o.beh||0)*4; }
  else { const cur=S.B[i*2], cb=cur-Math.floor(cur*0.25+1e-6)*4; if(bt<cb) S.B[i*2]=bt+(o.beh||0)*4; } // earliest arrival wins inside one element
}
function selfBlend(S,i,o){
  if(!S.SU||S.SU.length!==S.H.length) S.SU=new Float32Array(S.H.length).fill(-1e9);
  if(S.H[i]<=S.H0[i]+0.01) return false; const pu=S.SU[i]; return pu>-1e8&&Math.abs(o._u-pu)>o.sgap; }
function put(S,i,val,o,qq,xd,yd,bt){
  const H=S.H; const cur=H[i]; let nv;
  switch(o.mode){
    case 0: nv=val; if(o.sk&&selfBlend(S,i,o)){ const k=o.sk, d=Math.abs(cur-nv); if(d<k) nv=Math.max(cur,nv)+(k-d)*(k-d)/(4*k); } if(nv<=cur) return; break;
    case 1: { const b=S.H0[i], k=o.k, d=Math.abs(b-val); nv=d<k?Math.max(b,val)+(k-d)*(k-d)/(4*k):Math.max(b,val);
      if(o.sk&&selfBlend(S,i,o)){ const k2=o.sk, d2=Math.abs(cur-nv); if(d2<k2) nv=Math.max(cur,nv)+(k2-d2)*(k2-d2)/(4*k2); }
      if(nv<=cur) return; if(val<b){ H[i]=nv; if(o.sk) S.SU[i]=o._u; return; } break; }
    case 2: nv=-val; if(nv>=cur) return; break;

// 09 Sand — flat-topped clumps with steep walls: one merged drop when slow, scattered crumbs when fast
function clump(S,x,y,r,h,o,seed){ const ph=(seed*13.7)%200, k=1/Math.max(1,r); sphere(S,x,y,r*1.25,0,Object.assign({mode:0,pf:q=>q<0.62?1:Math.max(0,1-(q-0.62)/0.38),hs:h/Math.max(0.5,r*1.25),qf:(q,xx,yy)=>q+0.05+(nz((xx-x)*k*22+ph,(yy-y)*k*22)*0.75+nz((xx-x)*k*60+ph,(yy-y)*k*60+40)*0.25)},o)); }
function sandClumpSeg(ctx,c,i){ const P=ctx.P, S=ctx.S, a=c.pts[i-1], b=c.pts[i], col=cOf(P);
  const slow=clamp(1-b.sp/0.5,0,1), rr=b.r, h=P.height*12, base={mat:M.SAND,c:col,grain:P.grainTex*255,gloss:15};
  const seg=Math.hypot(b.x-a.x,b.y-a.y)+0.6;
  if(slow>0.25){ clump(S,b.x,b.y,rr*(0.55+0.55*slow*P.clump),h,Object.assign({vr:128},base,AP(ctx,c,b.u,0,0)),i); }
  const n=Math.round(P.density*seg*0.05*(0.5+(1-slow)*1.2)+c.rng()*0.7);
  for(let k=0;k<n;k++){ const t=c.rng(), sp=rr*(0.35+1.1*(1-slow)*P.spread);
    const x=a.x+(b.x-a.x)*t+gauss(c.rng)*sp*0.55, y=a.y+(b.y-a.y)*t+gauss(c.rng)*sp*0.55, r=rr*(0.22+0.45*Math.pow(c.rng(),1.3))*P.crumb;
    clump(S,x,y,r,h,Object.assign({vr:120+c.rng()*16},base,AP(ctx,c,a.u+(b.u-a.u)*t,c.ra()*0.07,1,0)),i*31+k); }
}
// 21 Relief sand: fine grains heaped into relief
function sandSeg(ctx,c,i){ const P=ctx.P, S=ctx.S, a=c.pts[i-1], b=c.pts[i], col=cOf(P);
  const slow=clamp(1-b.sp/0.55,0,1), rr=b.r, spread=rr*(0.35+1.7*(1-slow)*P.spread);
  if(P.heap>0) ropeSeg(ctx,c,i,{mode:1,k:rr*0.8,pf:PF.soft,hs:P.heap*0.45,mat:M.SAND,c:col,vr:128,grain:P.grainTex*255,tex:(u,v,x,y,r)=>nz(x*1.2,y*1.2)*r*0.12*P.heap+hash2(Math.round(x*2),Math.round(y*2))*r*0.05},false,0.85);
  if(slow>0.3&&P.clump>0) gaussAdd(S,b.x,b.y,rr*0.65,(slow-0.3)*P.clump*rr*0.12,Object.assign({mat:M.SAND,c:col,vr:128,grain:P.grainTex*255},AP(ctx,c,b.u,0.01,0)));
  const seg=Math.hypot(b.x-a.x,b.y-a.y)+0.8, n=Math.round(P.density*seg*rr*0.32*(0.35+slow));
  for(let k=0;k<n;k++){ const t=c.rng(), gx=gauss(c.rng), gy=gauss(c.rng);
    const x=a.x+(b.x-a.x)*t+gx*spread*0.5, y=a.y+(b.y-a.y)*t+gy*spread*0.5, gr=P.grain*(0.55+0.9*c.rng());
    sphere(S,x,y,gr,S.hAt(x,y)*0.92,Object.assign({mode:0,pf:PF.round,hs:1,mat:M.SAND,c:col,vr:c.rng()*255,grain:P.grainTex*255,gloss:40},AP(ctx,c,a.u+(b.u-a.u)*t,c.ra()*0.09,1,0))); }
}
